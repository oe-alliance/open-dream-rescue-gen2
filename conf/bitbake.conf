BBFILES = "${ODR_SOURCE}/recipes/*.bb"
BB_DEFAULT_TASK = "build"
BB_NUMBER_THREADS = "1"
BB_NO_NETWORK = "1"
BB_BASEHASH_IGNORE_VARS = "TIME DATE DATETIME"
TMPDIR = "${TOPDIR}/tmp"
CACHE = "${TMPDIR}/cache"
PERSISTENT_DIR = "${CACHE}"
PN = "odr-gen2"
PV = "1.0"
PR = "r0"
PF = "${PN}-${PV}-${PR}"
WORKDIR = "${TMPDIR}/work/${PN}-${PV}/${ODR_MODEL}"
B = "${WORKDIR}/build"
T = "${WORKDIR}/temp"
STAMP = "${TMPDIR}/stamps/${PF}-${ODR_MODEL}"
DEPLOY_DIR_IMAGE = "${TOPDIR}/deploy/${ODR_MODEL}"
export PATH
export HOME
export LC_ALL = "C"
